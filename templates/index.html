<!DOCTYPE html>
<html>
<head>
  <title>SG AI</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      background: radial-gradient(circle at top, #2c3e63, #0f172a);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* CENTER TEXT */
    .hero {
      padding: 120px 25px;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 500;
      margin: 0;
    }

    .hero p {
      font-size: 22px;
      margin-top: 10px;
      color: rgba(255,255,255,0.6);
      line-height: 1.3;
    }

    /* CHAT AREA */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .bot {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }

    /* FLOATING INPUT */
    .input-container {
      padding: 15px;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 50px;
      padding: 10px 12px;
    }

    .input-box input {
      flex: 1;
      border: none;
      background: none;
      color: white;
      font-size: 16px;
      outline: none;
      padding: 8px;
    }

    .icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-left: 6px;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="chat" id="chat"></div>

<div class="hero" id="hero">
  <h1>Hi, Siri</h1>
  <p>How can I help you today?</p>
</div>

<div class="input-container">
  <div class="input-box">
    <div class="icon">＋</div>

    <input id="msg" placeholder="Ask me anything..." oninput="toggleBtn()" />

    <div class="icon" id="mic">🎤</div>
    <div class="icon" id="send" style="display:none;" onclick="sendMsg()">➤</div>
  </div>
</div>

<script>
function toggleBtn() {
  let val = document.getElementById("msg").value;
  document.getElementById("mic").style.display = val ? "none" : "flex";
  document.getElementById("send").style.display = val ? "flex" : "none";
}

function addMessage(text, type) {
  let chat = document.getElementById("chat");
  let div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMsg() {
  let input = document.getElementById("msg");
  let text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  toggleBtn();

  document.getElementById("hero").style.display = "none";

  fetch(`/chat?msg=${encodeURIComponent(text)}`)
    .then(res => res.json())
    .then(data => {
      addMessage(data.reply, "bot");
    });
}
</script>

</body>
</html>
